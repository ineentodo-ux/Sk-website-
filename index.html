<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK // Sajim</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:monospace;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    color:#00ff66;
}

#matrix{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:.7;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
    background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.025) 0px,
        rgba(255,255,255,.025) 1px,
        transparent 2px,
        transparent 4px
    );
}

.container{
    position:relative;
    z-index:2;
    width:90%;
    max-width:430px;
    text-align:center;
}

.logoBox{
    margin-bottom:25px;
}

.logo{
    display:inline-block;
    font-size:100px;
    font-weight:900;
    letter-spacing:-8px;
    color:#00ff66;
    text-shadow:
        0 0 5px #00ff66,
        0 0 15px #00ff66,
        0 0 35px #00ff66;
    animation:glitch 1.8s infinite;
}

.sajim{
    margin-top:-8px;
    margin-left:85px;
    color:#00ff66;
    font-size:18px;
    letter-spacing:8px;
    text-shadow:0 0 12px #00ff66;
}

@keyframes glitch{
    0%,90%,100%{transform:translate(0);}
    92%{transform:translate(-4px,2px);}
    94%{transform:translate(4px,-2px);}
    96%{transform:translate(-2px,1px);}
}

.terminal{
    min-height:150px;
    padding:18px;
    text-align:left;
    border:1px solid #00ff66;
    background:rgba(0,0,0,.78);
    box-shadow:
        0 0 20px rgba(0,255,102,.35),
        inset 0 0 20px rgba(0,255,102,.08);
    color:#00ff66;
    font-size:12px;
    line-height:1.8;
    overflow:hidden;
}

.terminal::before{
    content:"SK_TERMINAL";
    display:block;
    margin-bottom:10px;
    color:#fff;
    opacity:.8;
}

.warning{
    display:none;
    margin-top:18px;
    padding:20px 10px;
    color:#ff2020;
    border:1px solid #ff2020;
    background:rgba(255,0,0,.08);
    box-shadow:
        0 0 20px rgba(255,0,0,.55),
        inset 0 0 20px rgba(255,0,0,.08);
    text-shadow:0 0 12px red;
    animation:danger .35s infinite alternate;
}

.warning.show{
    display:block;
}

.warningIcon{
    display:block;
    font-size:32px;
    margin-bottom:8px;
}

.warningTitle{
    font-size:17px;
    font-weight:bold;
    letter-spacing:2px;
}

.warningText{
    margin-top:8px;
    font-size:11px;
    line-height:1.7;
}

@keyframes danger{
    from{
        opacity:.55;
        transform:translateX(-1px);
    }
    to{
        opacity:1;
        transform:translateX(1px);
    }
}

.footer{
    margin-top:18px;
    font-size:9px;
    letter-spacing:4px;
    color:#00aa44;
}

/* EXIT POPUP */

.exitOverlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    background:rgba(0,0,0,.88);
    justify-content:center;
    align-items:center;
    padding:20px;
}

.exitOverlay.show{
    display:flex;
}

.exitBox{
    width:100%;
    max-width:360px;
    padding:25px 18px;
    text-align:center;
    border:1px solid #ff2020;
    background:#050505;
    color:#ff2020;
    box-shadow:
        0 0 30px rgba(255,0,0,.5),
        inset 0 0 20px rgba(255,0,0,.1);
    animation:popup .2s ease-out;
}

@keyframes popup{
    from{
        transform:scale(.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.exitIcon{
    font-size:35px;
    margin-bottom:12px;
}

.exitTitle{
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
}

.exitText{
    margin:12px 0 20px;
    font-size:11px;
    line-height:1.7;
}

.exitButtons{
    display:flex;
    gap:10px;
    justify-content:center;
}

.exitButtons button{
    flex:1;
    padding:12px 8px;
    border:1px solid #00ff66;
    background:#001a09;
    color:#00ff66;
    font-family:monospace;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 10px rgba(0,255,102,.25);
}

.exitButtons .cancel{
    border-color:#ff2020;
    background:#1a0000;
    color:#ff2020;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">

    <div class="logoBox">
        <div class="logo">SK</div>
        <div class="sajim">Sajim</div>
    </div>

    <div class="terminal" id="terminal"></div>

    <div class="warning" id="warning">
        <span class="warningIcon">⚠️</span>

        <div class="warningTitle">
            SK CYBER ALERT
        </div>

        <div class="warningText">
            SECURITY BREACH DETECTED
            <br>
            SYSTEM STATUS: CRITICAL
            <br>
            INFORMATION LOSSING...
        </div>
    </div>

    <div class="footer">
        SK // SAJIM // 2026
    </div>

</div>


<!-- EXIT POPUP -->

<div class="exitOverlay" id="exitOverlay">

    <div class="exitBox">

        <div class="exitIcon">⚠️</div>

        <div class="exitTitle">
            EXIT ACCESS REQUIRED
        </div>

        <div class="exitText">
            Are you sure you want to terminate
            the current SK session?
        </div>

        <div class="exitButtons">

            <button class="cancel" onclick="closeExit()">
                CANCEL
            </button>

            <button onclick="exitSite()">
                EXIT
            </button>

        </div>

    </div>

</div>


<script>

/* MATRIX */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%@";
const size = 14;

let drops = [];

function resize(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    drops = Array(
        Math.floor(canvas.width / size)
    ).fill(1);
}

resize();

window.addEventListener("resize", resize);

function matrix(){

    ctx.fillStyle = "rgba(0,0,0,.08)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "#00ff66";
    ctx.font = size + "px monospace";

    for(let i=0;i<drops.length;i++){

        const char =
            chars[
                Math.floor(
                    Math.random()*chars.length
                )
            ];

        ctx.fillText(
            char,
            i*size,
            drops[i]*size
        );

        if(
            drops[i]*size > canvas.height &&
            Math.random() > .975
        ){
            drops[i]=0;
        }

        drops[i]++;
    }
}

setInterval(matrix,35);


/* TERMINAL */

const terminal =
    document.getElementById("terminal");

const warning =
    document.getElementById("warning");

const lines = [

    "> Initializing SK system...",
    "> Establishing secure connection...",
    "> Scanning network...",
    "> Processing security layers...",
    "> Access sequence detected...",
    "> WARNING LEVEL: HIGH"

];

let i=0;

function typeLines(){

    if(i<lines.length){

        terminal.innerHTML +=
            "<div>"+lines[i]+"</div>";

        i++;

        setTimeout(typeLines,550);

    }else{

        setTimeout(()=>{

            warning.classList.add("show");

        },700);
    }
}

setTimeout(typeLines,700);


/* EXIT SYSTEM */

const exitOverlay =
    document.getElementById("exitOverlay");

function showExit(){

    exitOverlay.classList.add("show");

}

function closeExit(){

    exitOverlay.classList.remove("show");

}

function exitSite(){

    closeExit();

    /*
       Browser security prevents a webpage
       from forcibly closing the user's tab.
       This safely returns to the previous page.
    */

    if(history.length > 1){
        history.back();
    }else{
        window.location.href = "about:blank";
    }

}


/* BACK BUTTON */

history.pushState(
    {skSession:true},
    "",
    location.href
);

window.addEventListener(
    "popstate",
    function(){

        history.pushState(
            {skSession:true},
            "",
            location.href
        );

        showExit();

    }
);

</script>

</body>
</html>
