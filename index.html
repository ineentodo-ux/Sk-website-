<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SK // SYSTEM</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#000;
    color:#00ff66;
    font-family:"Courier New",monospace;
    overflow:hidden;
}

/* Matrix-style background */
canvas{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:.25;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(0,255,80,.03) 0px,
            rgba(0,255,80,.03) 1px,
            transparent 1px,
            transparent 4px
        );
}

/* Main */
.container{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:520px;
    padding:35px 25px;
    text-align:center;

    background:rgba(0,15,5,.88);
    border:1px solid #00ff66;
    border-radius:18px;

    box-shadow:
        0 0 20px rgba(0,255,80,.25),
        inset 0 0 30px rgba(0,255,80,.05);

    animation:cardIn 1s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:scale(.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.logo{
    font-size:90px;
    font-weight:900;
    letter-spacing:-8px;

    color:#00ff66;
    text-shadow:
        0 0 5px #00ff66,
        0 0 20px #00ff66,
        0 0 50px #00ff66;

    animation:glitch 2s infinite;
}

@keyframes glitch{
    0%,90%,100%{
        transform:translate(0);
    }
    92%{
        transform:translate(-4px,2px);
    }
    94%{
        transform:translate(4px,-2px);
    }
    96%{
        transform:translate(-2px,0);
    }
}

.status{
    margin-top:5px;
    font-size:12px;
    letter-spacing:3px;
    color:#00ff66;
}

.status span{
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

h1{
    margin-top:20px;
    font-size:24px;
    color:white;
}

.subtitle{
    margin-top:12px;
    color:#6cff9b;
    font-size:13px;
    letter-spacing:2px;
}

.line{
    width:100%;
    height:1px;
    margin:25px 0;
    background:#00ff66;
    box-shadow:0 0 10px #00ff66;
}

.terminal{
    text-align:left;
    min-height:105px;
    padding:15px;

    background:#000;
    border:1px solid rgba(0,255,100,.3);
    border-radius:10px;

    color:#00ff66;
    font-size:12px;
    line-height:1.8;
}

.cursor{
    animation:blink .7s infinite;
}

.btn{
    margin-top:22px;
    padding:13px 28px;

    background:#00ff66;
    color:#000;

    border:0;
    border-radius:8px;

    font-family:inherit;
    font-weight:bold;
    cursor:pointer;

    box-shadow:0 0 20px rgba(0,255,100,.4);
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(0,255,100,.7);
}

.footer{
    margin-top:25px;
    font-size:10px;
    color:#39734c;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div class="overlay"></div>

<div class="container">

<div class="card">

    <div class="logo">SK</div>

    <div class="status">
        SYSTEM ONLINE <span>●</span>
    </div>

    <h1>Welcome to SK's World</h1>

    <p class="subtitle">
        UNKNOWN • ENCRYPTED • UNDEFINED
    </p>

    <div class="line"></div>

    <div class="terminal" id="terminal">
        <div>> Initializing system...</div>
        <div>> Establishing secure connection...</div>
        <div>> Scanning network...</div>
        <div>> Access status: <b>SIMULATION</b></div>
        <div>> <span class="cursor">█</span></div>
    </div>

    <button class="btn" onclick="runSimulation()">
        ENTER SYSTEM
    </button>

    <div class="footer">
        SK // DIGITAL EXPERIENCE // 2026
    </div>

</div>

</div>

<script>

/* Matrix animation */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars =
"01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@";

const fontSize = 14;
const columns = Math.floor(canvas.width / fontSize);

const drops = Array(columns).fill(1);

function matrix(){

    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#00ff66";
    ctx.font = fontSize + "px monospace";

    for(let i=0;i<drops.length;i++){

        const text =
        chars[Math.floor(Math.random()*chars.length)];

        ctx.fillText(
            text,
            i*fontSize,
            drops[i]*fontSize
        );

        if(
            drops[i]*fontSize > canvas.height &&
            Math.random() > .975
        ){
            drops[i]=0;
        }

        drops[i]++;
    }
}

setInterval(matrix,35);


/* Fake terminal animation */

function runSimulation(){

    const terminal =
    document.getElementById("terminal");

    const messages=[
        "> Connecting...",
        "> Checking system...",
        "> Encrypting connection...",
        "> Running visual simulation...",
        "> Access: DEMO MODE",
        "> No real device access.",
        "> Welcome to SK's World."
    ];

    terminal.innerHTML="";

    let i=0;

    const interval=setInterval(()=>{

        terminal.innerHTML +=
        "<div>"+messages[i]+"</div>";

        i++;

        if(i>=messages.length){

            clearInterval(interval);

            terminal.innerHTML +=
            '<div><span class="cursor">█</span></div>';
        }

    },500);
}


/* Resize */

window.addEventListener("resize",()=>{

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

});

</script>

</body>
</html>
